<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<script src="suica.js"></script>
	</head>

	<body>
		<suica fullWindow>
			<orbit>
			<sphere id="position" size="100,50" hidden>
			<cube id="orientation" size="360" hidden>
		</suica>
		
		<script>
			n=200;
			
			function cottonSwab() {
				var color=hsl(random(0, 360), 100, 70);
				
				return group(
					cylinder([0, -7, 0], [0.5, 14], color),
					sphere([0, 7, 0], [1, 3], "white"),
					sphere([0, -7, 0], [1, 3], "white"));
			}
			
			for(var i=0; i<n; ++i) {
				swab=cottonSwab();
				its.center=randomIn(position);
				its.spin=randomIn(orientation);
			}
		</script>
	</body>
</html>
