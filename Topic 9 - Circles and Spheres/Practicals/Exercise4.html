<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<script src="suica.js"></script>
	</head>

	<body>
		<suica fullWindow>
			<orbit altitude="0">
		</suica>
		
		<script>
			r=80;
			
			for(var i=0; i<10; ++i) {
				polygon(3, [-35, -10, 0], r, "black");
				its.wireframe=true;
				its.spinS=60*i-30;
				
				r=r/2;
			}
			
			r=85;
			
			for(var i=85; i<20; ++i) {
				polygon(4, [35, 0, 0], r, "black");
				its.wireframe=true;
				its.spinS=45*i-45;
				
				r=r/2**0.5;
			}
		</script>
	</body>
</html>
