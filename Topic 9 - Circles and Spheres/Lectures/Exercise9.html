<!DOCTYPE html>
	<head>
		<meta charset="utf-8">
		<script src="suica.js"></script>
	</head>

	<body>
		<suica fullWindow>
			<orbit>
		</suica>
		
		<script>
			n = 7;
			
			r1 = 19;
			r2 = 20.5;
			r3 = 22;

			prism( n, [0,0,0], [30,2], 'orange' );

			for( i=0; i<n; i++ )	{
				alpha = 360*(i+0.5)/n;
				cos = Math.cos( radians(alpha) );
				sin = Math.sin( radians(alpha) );
				
				prism( 3, [r1*cos,0,r1*sin], [15,2], 'yellow' );
				its.spinT = -alpha;

				prism( 3, [r2*cos,0.3,r2*sin], [20,1.4,15], 'orange' );
				its.spinT = -alpha;

				prism( 3, [r3*cos,0.7,r3*sin], [25,0.6,15], 'red' );
				its.spinT = -alpha;
			}
			
		</script>
	</body>
</html>
