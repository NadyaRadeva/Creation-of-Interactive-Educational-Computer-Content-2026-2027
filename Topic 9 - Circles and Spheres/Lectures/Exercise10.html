<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<script src="suica.js"></script>
	</head>

	<body>
		<suica fullWindow>
			<orbit altitude="0" distance="60">
			<sphere color="white">
		</suica>
		
		<script>
			n = 20;
			j = 1;
			
			for( i=0; i<n; i++ )	{
				j = -j;
				
				prism( 4, [0,0,0], [8,15], 'black' );
				its.spinH = 360/n*i;
				its.spinV = 90 - 10*j;

				prism( 3, [0,0,0], [4.5,15,7], 'black' );
				its.spinH = 360/n*i;
				its.spinV = 90 + 22*j;
				its.spinT = 90*j;
			}
		</script>
	</body>
</html>
