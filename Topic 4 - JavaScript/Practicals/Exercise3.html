<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>

    <body>
        <script>
            var a = 0, b = 0, c = 1;
            var n = 20;

            console.log(a);
            console.log(b);
            console.log(c);

            for (var i = 3; i < n; i++) {
                var d = a + b + c;
                console.log(d);

                a = b;
                b = c;
                c = d;
            }
        </script>
    </body>
</html>
