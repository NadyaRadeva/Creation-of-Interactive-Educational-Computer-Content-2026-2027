<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
	</head>

	<body>
		<script>
			var grade = 77.2;
			
			if(grade < 40) {
				console.log(grade + " точки са Слаб (2)");
			}
			else if(grade < 60) {
				console.log(grade + " точки са Среден (3)");
			}
			else if(grade < 75) {
				console.log(grade + " точки са Добър (4)");
			}
			else if(grade < 90) {
				console.log(grade + " точки са Мн. Добър (5)");
			}
			else {
				console.log(grade + " точки са Отличен (6)");
			}
		</script>
	</body>
</html>
