<!DOCTYPE html>
<head>
	<meta charset="utf-8">
	<script src="suica.js"></script>
</head>

<body>
	<suica fullWindow>
		<orbit>
	</suica>
	
	<script>
		n = 1000;
		r = 30;
		size = [0.5,5,5];
		
		function sin( x ) { 
      return Math.sin( radians(x) ); 
    }
    
		function cos( x ) { 
      return Math.cos( radians(x) );
    }
		
		for( var i=0; i<n; i++ ) {
			alpha = random( 0, 360 );
			beta = random( -80, 80 );

			center = [r*cos(alpha)*cos(beta),	r*sin(beta),	r*sin(alpha)*cos(beta)]
			
			color = hsl( alpha+beta, 100, 50 );
			
			a = cube( center, size, color );
			a.spinT = -alpha;
			a.spinS = beta;
		}
	</script>
</body>
