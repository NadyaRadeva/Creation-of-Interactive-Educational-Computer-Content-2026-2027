<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<script src="suica.js"></script>
	</head>
	
	<body>
		<suica fullWindow>
			<orbit enablePan="true">
		</suica>
		
		<script>
			ф = (1+Math.sqrt(5))/2;
						
			function myCube( x, z, size )
			{
				cube( [x+size/2,size/2-10,z-size/2], size, 'black' );
				its.wireframe = true;
			}
			
			size = 30;
			x = -size*ф/2;
			z = size/2;

			for( var i=0; i<15; i++ )	{
				myCube( x, z, size );

				if( i%2 ) {
					z -= size;
				}
				else {
					x += size;
				}

				size = size/ф;
			}
		</script>
	</body>
</html>
