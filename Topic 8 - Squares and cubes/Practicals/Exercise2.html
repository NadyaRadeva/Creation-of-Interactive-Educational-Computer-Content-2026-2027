<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <script src="suica.js"></script>
</head>

<body>
    <suica fullWindow>
        <orbit altitude="0">
    </suica>

    <script>
		n = 40;
		
		square([0, 0, n/2], n, "blue");
		square([0, 0, -n/2], n, "yellow");
		
		square([n/2, 0, 0], n, "black");
		its.spinH=90;
		
		square([-n/2, 0, 0], n, "red");
		its.spinH=-90;
		
		square([0, n/2, 0], n, "green");
		its.spinV=90;
		
		square([0, -n/2, 0], n, "linen");
		its.spinV=-90;
    </script>
</body>
</html>
