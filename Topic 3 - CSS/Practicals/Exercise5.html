<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		
		<style>
			body {
				font-family: Candara;
				border: 3px solid black;
				margin-left: 20%;
				margin-right: 20%;
				padding: 15px;
			}
			
			.title {
				font-size: 3em;
				text-align: center;
				font-weight: bold;
				border-bottom: 3px solid black;
				padding-bottom: 5px;
				margin-bottom: 5px;
			}
			
			.heading1 {
				font-size: 2em;
				font-weight: bold;
			}
			
			.heading2 {
				font-size: 2em;
				font-weight: bold;
			}
			
			.note {
				font-size: 1em;
				font-weight: lighter;
			}
			
			.pagenumber {
				font-size: 0.75em;
				text-align: center;
				border-top: 1px solid lightgray; 
				margin-top: 4em;
				font-weight: lighter;
				text-align: center;
				width: 5em;
				margin-left: auto;
				margin-right: auto;
			}
			
			ul {
				padding-left: 3em;
				margin-top: 0.2em
			}
			
			.bold {
				font-weight: bold;
			}
			
			.italic {
				font-style: italic;
			}
		</style>
	</head>
	
	<body>

		<div class="title">Размери</div>

		<div class="heading1">Основни свойства</div>
		<ul>
			<li><span class="bold">width</span> - хоризонтален размер (широчина)</li>
			<li><span class="bold">height</span> - вертикален размер (височина)</li>
		</ul>
		
		<div class="heading2">Задаване на размер</div>
		<ul>
			<li>
				Чрез мярка: <span class="bold">px</span> (пиксел), <span class="bold">em</span> (размер на "М"), …
				<div class="note">(мярката се записва плътно до числото: <span class="italic">300px, 1.5em</span>)</div>
			</li>
			<li>Чрез процент: %</li>
		</ul>
		<div class="pagenumber">19</div>
	</body>
</html>
