<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<script src="suica.js"></script>
	</head>
	
	<body>
		<suica fullwindow background="dimgray">
			<orbit>
		</suica>
		
		<script>
			n = 100;
			
			volume = sphere( [0,0,0], 80 );
			its.visible = false;

			lamps = [];
			for( var i=0; i<n; i++) {
				lamps.push( sphere( randomIn(volume), 5, 'white' ) );
      }
				
			for( var i=0; i<n; i++)
			{
				var dX = lamps[i].x-0, dY = lamps[i].y-0,	dZ = lamps[i].z-0;
				
				var length = Math.sqrt( dX**2 + dY**2 + dZ**2 );
				
				cylinder( [0,0,0], [0.7,length], 'orange' );
				
				its.lookAt( lamps[i] );
			}
		</script>
	</body>
	
</html>
