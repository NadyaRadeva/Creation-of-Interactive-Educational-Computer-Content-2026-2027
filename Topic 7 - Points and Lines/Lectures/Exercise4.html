<!DOCTYPE html>

	<body>
		<suica>
		</suica>
		
		<script>
			n = 50;
			
			r = 25;
			
			for(var i = 0; i < n; ++i) {
				alpha = radians(360 * i / n);
				
				x = r * Math.cos(alpha);
				y = r * Math.sin(alpha);
				z = 0;
				
				point([x, y, z], 2 + 3 * (i % 2));
			}
			
		</script>
	</body>
