<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<script src="suica.js"></script>
	</head>
	
	<body>
		<suica fullWindow>
			<orbit>
		</suica>
		
		<script>
			n = 500;
			
			r = 30;
			
			for(var i = 0; i < n; ++i) {
				alpha = radians(random(0, 360));
				beta = radians(random(-90, 90));
				
				x = r * Math.cos(alpha) * Math.cos(beta);
				y = r * Math.sin(alpha) * Math.cos(beta);
				z = r * Math.sin(beta);
				
				point([x, y, z], random(1,5));
			}
 		</script>
	</body>
</html>
