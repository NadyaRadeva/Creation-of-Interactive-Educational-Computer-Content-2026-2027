<!DOCTYPE html>

<html>

	<head>
		<meta charset="utf-8">
		<script src="suica.js"></script>
	</head>
	
	<body>
		<suica fullWindow>
			<orbit>
		</suica>
		
		<script>
			n = 80;
			r = 20;
			h = 50;
			
			x = [];
			z = [];

			for( var i=0; i<n; i++ ) {
				alpha = radians( 360 * i/n );
				x[i] = r * Math.cos( alpha );
				z[i] = r * Math.sin( alpha );
			}

			for( var i=0; i<n; i++ ) {
				j = (i+20)%n;
				line( [x[i],h/2,z[i]], [x[j],-h/2,z[j]] );

				j = (i+n-20)%n;
				line( [x[i],h/2,z[i]], [x[j],-h/2,z[j]] );
			}
		</script>
	</body>
</html>
