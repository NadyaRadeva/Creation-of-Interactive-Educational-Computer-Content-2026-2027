<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<script src="suica.js"></script>
	</head>
	
	<body>
		<suica fullWindow>
			<orbit>
		</suica>
		
		<script>
			n = 500;
			r = 25;
			
			for( var i=0; i<n; i++ )
			{
				alpha = random( 0, 360 );
				beta = random( -90, 90 );
				
				x = r * Math.cos(alpha) * Math.cos(beta);
				y = r * Math.sin(alpha) * Math.cos(beta);
				z = r * Math.sin(beta);
				
				k = random( 1.1, 1.4 );
				
				point( [x,y,z], 2 );
				line( [x,y,z], [k*x,k*y,k*z] );
			}
		</script>
	</body>
</html>
